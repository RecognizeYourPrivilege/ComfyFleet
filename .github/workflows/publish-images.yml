# Build both ComfyFleet images and push them to GHCR.
# No GPU: Dockerfile does not import comfy_kitchen during the build.
# Torch wheels are large. The instance job frees disk first and allows 180 minutes.
# If the runner still runs out of disk or time, use scripts/publish-images.sh.
name: Publish images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.manager
      - docker/**
      - comfyfleet/**
      - ui/**
      - pyproject.toml
      - .github/workflows/publish-images.yml
  workflow_dispatch:
    inputs:
      publish_instance:
        description: Build and push the instance image
        type: boolean
        default: true
      publish_manager:
        description: Build and push the manager image
        type: boolean
        default: true

concurrency:
  group: publish-ghcr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  instance:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_instance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Free runner disk
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /opt/hostedtoolcache \
            || true
          sudo apt-get clean
          docker builder prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/comfyfleet" >> "${GITHUB_OUTPUT}"

      - name: Build and push instance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.names.outputs.image }}:phase1
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        run: echo "instance ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"

  manager:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_manager
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/comfyfleet-manager" >> "${GITHUB_OUTPUT}"

      - name: Build and push manager
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        run: echo "manager ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"

  summary:
    needs:
      - instance
      - manager
    if: always() && needs.instance.result == 'success' && needs.manager.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Record digests
        run: |
          {
            echo "## GHCR digests"
            echo ""
            echo "Pushed by this run. They are not pinned in the repo until a human copies them into the README."
            echo ""
            echo '```text'
            echo "instance ${{ needs.instance.outputs.image }}@${{ needs.instance.outputs.digest }}"
            echo "manager ${{ needs.manager.outputs.image }}@${{ needs.manager.outputs.digest }}"
            echo '```'
            echo ""
            echo "A personal-account package is private on first publish. Set both packages to public or anonymous docker pull fails. GITHUB_TOKEN does not change visibility."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "instance ${{ needs.instance.outputs.image }}@${{ needs.instance.outputs.digest }}"
          echo "manager ${{ needs.manager.outputs.image }}@${{ needs.manager.outputs.digest }}"
