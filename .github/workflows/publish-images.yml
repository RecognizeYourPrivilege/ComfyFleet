# Build the manager image and both instance lines and push them to GHCR.
# Primary instance tags: :cu130 and :cu124.
# Aliases: :latest → cu130, :phase1 → cu124.
# No GPU: neither instance Dockerfile imports comfy_kitchen during the build.
# Torch wheels are large. The instance job frees disk first and allows 180 minutes.
# If the runner still runs out of disk or time, use scripts/publish-images.sh.
name: Publish images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.cu124
      - Dockerfile.manager
      - docker/**
      - comfyfleet/**
      - ui/**
      - pyproject.toml
      - .github/workflows/publish-images.yml
  workflow_dispatch:
    inputs:
      publish_instance:
        description: Build and push the instance image
        type: boolean
        default: true
      publish_manager:
        description: Build and push the manager image
        type: boolean
        default: true

concurrency:
  group: publish-ghcr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  instance:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_instance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_tag: cu130
            dockerfile: Dockerfile
            alias: latest
          - cuda_tag: cu124
            dockerfile: Dockerfile.cu124
            alias: phase1
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Free runner disk
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /opt/hostedtoolcache \
            || true
          sudo apt-get clean
          docker builder prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/comfyfleet" >> "${GITHUB_OUTPUT}"

      - name: Instance tags
        id: tags
        run: |
          image="${{ steps.names.outputs.image }}"
          cuda_tag="${{ matrix.cuda_tag }}"
          alias="${{ matrix.alias }}"
          {
            echo "list<<EOF"
            echo "${image}:${cuda_tag}"
            echo "${image}:${alias}"
            echo "${image}:${GITHUB_SHA}-${cuda_tag}"
            if [[ "${cuda_tag}" == "cu130" ]]; then
              echo "${image}:${GITHUB_SHA}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push instance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.recognizeyourprivilege.comfyfleet.cuda-tag=${{ matrix.cuda_tag }}

      - name: Digest
        run: echo "instance-${{ matrix.cuda_tag }} ${{ steps.names.outputs.image }}:${{ matrix.cuda_tag }}@${{ steps.build.outputs.digest }} (alias :${{ matrix.alias }})"

  manager:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_manager
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/comfyfleet-manager-legacy" >> "${GITHUB_OUTPUT}"

      - name: Build and push manager
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        run: echo "manager ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"

  summary:
    needs:
      - instance
      - manager
    if: always() && needs.instance.result == 'success' && needs.manager.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Record digests
        run: |
          {
            echo "## GHCR digests"
            echo ""
            echo "Pushed by this run. install.sh pulls the moving tags (instance :cu130 and :cu124, manager :latest), so the next install follows this publish. Do not copy these digests into install.sh. COMFYFLEET_INSTANCE_DIGEST and COMFYFLEET_MANAGER_DIGEST are the optional pin."
            echo ""
            echo '```text'
            echo "instance cu130 and cu124 (aliases latest→cu130, phase1→cu124). Matrix digest output is one leg; both tags moved with this publish."
            echo "instance ${{ needs.instance.outputs.image }}@${{ needs.instance.outputs.digest }}"
            echo "manager ${{ needs.manager.outputs.image }}@${{ needs.manager.outputs.digest }}"
            echo '```'
            echo ""
            echo "A personal-account package is private on first publish. Set both packages to public or anonymous docker pull fails. GITHUB_TOKEN does not change visibility."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "instance cu130 ${{ needs.instance.outputs.image }}:cu130"
          echo "instance cu124 ${{ needs.instance.outputs.image }}:cu124"
          echo "instance ${{ needs.instance.outputs.image }}@${{ needs.instance.outputs.digest }}"
          echo "manager ${{ needs.manager.outputs.image }}@${{ needs.manager.outputs.digest }}"
