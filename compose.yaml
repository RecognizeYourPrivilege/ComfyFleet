# ComfyFleet manager. Pulls a prebuilt manager image from GHCR.
# The instance image is not a compose service. The manager creates each
# instance with docker create --shm-size 8g (Compose form: shm_size: '8g')
# on both CUDA lines.
# Primary instance tags: comfyfleet:cu130 (host driver CUDA 13.0, default)
# and comfyfleet:cu124 (host driver CUDA 12.4).
# Pull the chosen line before create. These are moving tags. The next GHCR
# publish is what the next pull gets. Pin with COMFYFLEET_INSTANCE_DIGEST
# or COMFYFLEET_MANAGER_DIGEST when install.sh should stay on one digest.
#   docker pull ghcr.io/recognizeyourprivilege/comfyfleet:cu130
# install.sh does that pull, tags comfyfleet:cu130 (or comfyfleet:cu124), and
# sets COMFYFLEET_INSTANCE_IMAGE and COMFYFLEET_CUDA_TAG.
# Changing an instance's CUDA line is a recreate, not a restart.
# A local rebuild is compose.build.yaml.
# Open http://<lan-host>:9100/ . Do not publish 9100 on the public internet.

services:
  manager:
    image: ${COMFYFLEET_MANAGER_IMAGE:-ghcr.io/recognizeyourprivilege/comfyfleet-manager-legacy:latest}
    container_name: comfyfleet-manager
    ports:
      - "9100:9100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ComfyFleet:/home/ComfyFleet
    environment:
      COMFYFLEET_PASSWORD: ${COMFYFLEET_PASSWORD:?Set COMFYFLEET_PASSWORD}
      COMFYFLEET_PUBLIC_HOST: ${COMFYFLEET_PUBLIC_HOST:-}
      COMFYFLEET_INSTANCE_IMAGE: ${COMFYFLEET_INSTANCE_IMAGE:-ghcr.io/recognizeyourprivilege/comfyfleet:cu130}
      COMFYFLEET_CUDA_TAG: ${COMFYFLEET_CUDA_TAG:-cu130}
      COMFYFLEET_BIND_HOST: 0.0.0.0
      COMFYFLEET_BIND_PORT: "9100"
    gpus: all
    restart: unless-stopped
