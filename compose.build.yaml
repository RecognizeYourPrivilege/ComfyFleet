# Development compose overlay for a local manager image.
# install.sh --build runs docker build for both Dockerfiles, then starts
# the manager with the local tags. This file is the compose equivalent:
#   docker build -t comfyfleet:phase1 .
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  manager:
    image: comfyfleet-manager:latest
    build:
      context: .
      dockerfile: Dockerfile.manager
    environment:
      COMFYFLEET_INSTANCE_IMAGE: comfyfleet:phase1
