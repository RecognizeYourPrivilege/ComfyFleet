[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyfleet"
version = "0.1.0"
description = "Host CLI and trusted-LAN control HTTP API for a ComfyUI workflow container fleet"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
comfyfleet = "comfyfleet.cli:main"

[tool.setuptools.packages.find]
include = ["comfyfleet*"]
